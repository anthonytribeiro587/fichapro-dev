name: Build FichaPRO DEV

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar aplicação
        id: build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Guardar log do build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fichapro-dev-build-log-${{ github.sha }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
